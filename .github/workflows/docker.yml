name: Build Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build env (secret, nu ajunge in imagine)
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
        run: printf '%s\n' "$BUILD_ENV" > "$RUNNER_TEMP/build.env"
      # Build-ul poate pica ocazional din cauza Google Fonts (limitare temporara) -> o reincercare automata
      - id: build1
        uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: .
          push: true
          secret-files: buildenv=${{ runner.temp }}/build.env
          tags: |
            ghcr.io/erolp18/toaletepublice.com:${{ github.sha }}
            ghcr.io/erolp18/toaletepublice.com:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.build1.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          secret-files: buildenv=${{ runner.temp }}/build.env
          tags: |
            ghcr.io/erolp18/toaletepublice.com:${{ github.sha }}
            ghcr.io/erolp18/toaletepublice.com:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
